# Runs the whole test suite on every push and pull request, against a
# throwaway Postgres that exists only for the run. The suites DROP the schema
# of the database they are given: SB_URL below must never be a real one.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      # A plain (non-TLS) local database: the "postgresql://" scheme keeps TLS off.
      SB_URL: postgresql://postgres:postgres@localhost:5432/alc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # node_modules is committed in this repository; the suite runs against
      # exactly what is deployed, so nothing is installed here.
      - name: Unit tests (no database)
        run: node tests/flows-unit.cjs && node tests/agents/agent-modules.cjs
      - name: Full suite (throwaway Postgres)
        run: npm test
